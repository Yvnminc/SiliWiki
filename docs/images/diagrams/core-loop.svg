<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="280" viewBox="0 0 1180 280" role="img" aria-labelledby="title desc">
<title id="title">SiliWiki core loop</title>
<desc id="desc">SiliWiki architecture diagram rendered as static SVG for reliable README display.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8f4b2e"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" rx="24" fill="#f8f2eb"/>
<text x="32" y="42" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="800" fill="#2f241d">SiliWiki core loop</text>
<g filter="url(#shadow)">
<rect x="35" y="95" width="145" height="80" rx="16" fill="#fff7ed" stroke="#9b3a0c" stroke-width="2"/><text text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#5a2a16"><tspan x="107.5" y="131.0">Clone</tspan><tspan x="107.5" y="149.0">SiliWiki</tspan></text>
<rect x="215" y="95" width="145" height="80" rx="16" fill="#fff7ed" stroke="#9b3a0c" stroke-width="2"/><text text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#5a2a16"><tspan x="287.5" y="131.0">Extract</tspan><tspan x="287.5" y="149.0">writer skill</tspan></text>
<rect x="395" y="95" width="145" height="80" rx="16" fill="#e6eef3" stroke="#5f7f90" stroke-width="2"/><text text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#23445d"><tspan x="467.5" y="131.0">Local agent</tspan><tspan x="467.5" y="149.0">writes pack</tspan></text>
<rect x="575" y="95" width="145" height="80" rx="16" fill="#fff7ed" stroke="#9b3a0c" stroke-width="2"/><text text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#5a2a16"><tspan x="647.5" y="131.0">Validate</tspan><tspan x="647.5" y="149.0">files</tspan></text>
<rect x="755" y="95" width="145" height="80" rx="16" fill="#fff7ed" stroke="#9b3a0c" stroke-width="2"/><text text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#5a2a16"><tspan x="827.5" y="131.0">Read on</tspan><tspan x="827.5" y="149.0">localhost</tspan></text>
<rect x="935" y="95" width="145" height="80" rx="16" fill="#fff7ed" stroke="#9b3a0c" stroke-width="2"/><text text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#5a2a16"><tspan x="1007.5" y="131.0">Improve</tspan><tspan x="1007.5" y="149.0">with git diffs</tspan></text>
<line x1="180" y1="135" x2="215" y2="135" stroke="#8f4b2e" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="360" y1="135" x2="395" y2="135" stroke="#8f4b2e" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="540" y1="135" x2="575" y2="135" stroke="#8f4b2e" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="720" y1="135" x2="755" y2="135" stroke="#8f4b2e" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="900" y1="135" x2="935" y2="135" stroke="#8f4b2e" stroke-width="2.4" marker-end="url(#arrow)"/>
