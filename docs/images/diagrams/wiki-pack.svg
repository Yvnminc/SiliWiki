<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="330" viewBox="0 0 1180 330" role="img" aria-labelledby="title desc">
<title id="title">What is a SiliWiki wiki pack?</title>
<desc id="desc">SiliWiki architecture diagram rendered as static SVG for reliable README display.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8f4b2e"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" rx="24" fill="#f8f2eb"/>
<text x="32" y="42" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="800" fill="#2f241d">What is a SiliWiki wiki pack?</text>
<g filter="url(#shadow)">
<rect x="35" y="135" width="220" height="80" rx="16" fill="#111827" stroke="#111827" stroke-width="2"/><text text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#ffffff"><tspan x="145.0" y="180.0">content/wikis/&lt;slug&gt;/</tspan></text><line x1="255" y1="175" x2="340" y2="175" stroke="#8f4b2e" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="340" y="130" width="140" height="90" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#0f172a"><tspan x="410.0" y="171.0">meta.json</tspan><tspan x="410.0" y="189.0">title, nav, theme</tspan></text><line x1="255" y1="175" x2="505" y2="175" stroke="#8f4b2e" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="505" y="130" width="140" height="90" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#0f172a"><tspan x="575.0" y="171.0">content.md</tspan><tspan x="575.0" y="189.0">main article</tspan></text><line x1="255" y1="175" x2="670" y2="175" stroke="#8f4b2e" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="670" y="130" width="140" height="90" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#0f172a"><tspan x="740.0" y="171.0">glossary.json</tspan><tspan x="740.0" y="189.0">terms + aliases</tspan></text><line x1="255" y1="175" x2="835" y2="175" stroke="#8f4b2e" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="835" y="130" width="140" height="90" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#0f172a"><tspan x="905.0" y="171.0">raw/sources.md</tspan><tspan x="905.0" y="189.0">evidence log</tspan></text><line x1="255" y1="175" x2="1000" y2="175" stroke="#8f4b2e" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1000" y="130" width="140" height="90" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650" fill="#0f172a"><tspan x="1070.0" y="171.0">images/</tspan><tspan x="1070.0" y="189.0">local media</tspan></text>
